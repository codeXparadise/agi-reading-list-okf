name: validate-okf
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bundle
        run: python tools/validate_okf.py .
      - name: Regenerate retrieval chunks
        run: python tools/build_chunks.py .
      - name: Check the chunk trees are reproducible
        run: git diff --exit-code
